services:
  # ── Telegram bot (Python, webhook web service) — bot only ──
  - type: web
    name: azim-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://azim.run.place"
      - key: BIN_CHANNEL
        sync: false
      - key: OWNER_USERNAME
        value: "Azimxyz"
      - key: OWNER_CHAT_ID
        sync: false
      - key: CAMERA_POLL_SECONDS
        value: "15"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: WEBHOOK_SECRET
        value: "azim-webhook-secret-2024"